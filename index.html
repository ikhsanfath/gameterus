<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Untuk My Ratu 👑</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b1b3d;--card:#3d2757;--rose:#ff6f91;--mint:#5eead4;--gold:#ffd166;--ink:#fff7fb;--mut:#c9b6dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:radial-gradient(circle at 50% -10%,#5b2f7a,var(--bg) 60%) fixed;color:var(--ink);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;font-weight:500}
body{max-width:480px;margin:auto;padding:env(safe-area-inset-top) 12px calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#bar{padding:10px 4px;font-size:15px;color:var(--mut);display:flex;gap:8px;align-items:center}
#bar b{flex:1;color:var(--ink);font-weight:700;line-height:1.2}
#mute{background:var(--card);border-radius:12px;padding:6px 10px}
.sec{display:none}.sec.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#1d1229;z-index:5}
nav button{flex:1;background:var(--card);border-radius:16px;padding:8px 0;font-weight:700;font-size:15px}
nav button.on{background:var(--rose);color:#2b1b3d}
.money{font-size:30px;font-weight:800;color:var(--gold);text-align:center;line-height:1}
.sub{text-align:center;color:var(--mut);font-size:14px;margin:2px 0 8px}
.face{position:relative;width:min(78vw,320px);aspect-ratio:5/6;margin:6px auto;border-radius:28px;overflow:hidden;background:#4a3268;touch-action:manipulation;cursor:crosshair}
.face img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.face svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translate(-9px,3px) rotate(-3deg)}75%{transform:translate(9px,-3px) rotate(3deg)}}
.stars{position:absolute;top:2%;left:0;right:0;text-align:center;font-size:26px;animation:sp 1.2s linear infinite;pointer-events:none}@keyframes sp{50%{transform:scale(1.2) rotate(8deg)}}
.hint{text-align:center;font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow:auto;padding:8px 0}
.tabs button{background:var(--card);border-radius:20px;padding:5px 12px;white-space:nowrap;font-size:14px}.tabs button.on{background:var(--mint);color:#1d1229;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{background:var(--card);border-radius:18px;padding:10px 6px;text-align:center;font-size:14px;line-height:1.2}
.it:active{transform:scale(.95)}.it big{display:block;font-size:30px}.it small{color:var(--gold);display:block;font-weight:700}.it.no{opacity:.45}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#fff;color:#2b1b3d;border-radius:20px;padding:12px 18px;max-width:86vw;text-align:center;font-weight:700;z-index:30;display:none;box-shadow:0 8px 30px #0008}
.fx{position:fixed;font-size:26px;pointer-events:none;z-index:20}
.girl{position:relative;width:min(80vw,330px);aspect-ratio:5/6;margin:8px auto;border-radius:30px;overflow:visible;cursor:pointer}
.girl img{width:100%;height:100%;object-fit:cover;border-radius:30px;display:block;pointer-events:none}
.hand{position:absolute;right:-4%;top:46%;font-size:64px;opacity:0;pointer-events:none}.hand.on{animation:poke 1.1s}
@keyframes poke{0%{opacity:0;transform:translateX(50px)}25%,70%{opacity:1;transform:translateX(-30px) rotate(-8deg)}100%{opacity:0;transform:translateX(0)}}
.blush{position:absolute;left:50%;top:-4%;transform:translateX(-50%);font-size:50px;opacity:0;pointer-events:none}.blush.on{animation:bl 1.2s}@keyframes bl{30%{opacity:1;transform:translateX(-50%) scale(1.3)}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
.doa{background:var(--card);border-radius:22px;padding:14px 16px;text-align:center;font-size:18px;line-height:1.3;min-height:86px;display:flex;align-items:center;justify-content:center}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:min(66vw,250px);margin:6px auto;aspect-ratio:1}
.board i{border-radius:4px;background:#ffffff14;transition:.25s}.board i.on{transform:scale(1.05)}
.row{display:flex;gap:6px;justify-content:center;margin:8px 0;min-height:60px;align-items:center}
.lab{font-size:12px;color:var(--mut);text-align:center}
.bk{width:60px;border-radius:14px;border:3px solid var(--c,#fff3);background:#ffffff10;text-align:center;font-size:12px;padding:4px 0;min-height:56px}.bk em{display:block;width:18px;height:18px;margin:2px auto;border-radius:5px;background:var(--c)}
.slot{width:54px;height:54px;border-radius:50%;border:2px dashed #ffffff33;display:grid;place-items:center}
.ant{position:relative;width:54px;height:54px;border-radius:50%;border:3px solid var(--c);background-color:#4a3268;background-repeat:no-repeat;background-size:220%;padding:0;box-shadow:0 4px 0 #0005}
.ant:active{transform:translateY(3px)}
.ant:before,.ant:after{content:"";position:absolute;top:-11px;width:3px;height:13px;background:#fff9;border-radius:3px}.ant:before{left:14px;transform:rotate(-22deg)}.ant:after{right:14px;transform:rotate(22deg)}
.ant i{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border-radius:6px;background:var(--c);border:2px solid #fff}
.btn{display:block;margin:10px auto;background:var(--rose);color:#2b1b3d;font-weight:800;padding:10px 24px;border-radius:22px;font-size:17px}
#splash,#win{position:fixed;inset:0;background:#1d1229ee;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
#win{display:none}#splash img,#win img{width:150px;aspect-ratio:5/6;object-fit:cover;border-radius:24px}
#splash h1{margin:0;font-size:26px;line-height:1.15}#splash p,#win p{margin:0;max-width:330px;color:var(--mut);font-size:17px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<div id="bar"><b id="gr"></b><button id="mute">🔊</button></div>

<section class="sec on" id="s1">
  <div class="money" id="money">Rp0</div><div class="sub" id="stage">Masih ganteng 😎</div>
  <div class="face" id="face"><img id="fimg" alt=""><svg id="dmg" viewBox="0 0 400 480"></svg><div class="stars" id="stars"></div></div>
  <div class="hint">Ketuk wajahnya untuk memukul 🔨 · Rp100.000 per pukulan</div>
  <div class="tabs" id="tabs"></div><div class="grid" id="shop"></div>
</section>

<section class="sec" id="s2">
  <div class="sub" style="font-size:16px">Ketuk pipi Ratu ya 🥰</div>
  <div class="girl" id="girl"><img id="gimg" alt=""><div class="hand" id="hand">👉</div><div class="blush" id="blush">🥰</div></div>
  <div class="doa" id="doa">Ketuk Ratu untuk mendapat doa baik 🌷</div>
</section>

<section class="sec" id="s3">
  <div class="money" style="font-size:22px" id="lvl"></div><div class="sub">Antar kubus warna ke keranjang yang pas, ungkap gambarnya 💞</div>
  <div class="board" id="board"></div>
  <div class="lab">Keranjang</div><div class="row" id="bks"></div>
  <div class="lab">Antrean semut (ketuk untuk mengirim)</div><div class="row" id="que"></div>
  <div class="lab">Parkir (maks 5)</div><div class="row" id="park"></div>
  <button class="btn" id="rst" style="background:var(--mint)">Ulangi level 🔄</button>
</section>

<nav><button data-t="s1" class="on">🔨 Pukul</button><button data-t="s2">🥰 Ratu</button><button data-t="s3">🐜 Semut</button></nav>
<div id="toast"></div>
<div id="splash"><img id="simg" alt=""><h1 id="sg"></h1><p id="sm"></p><button class="btn" id="go">Mulai main 💖</button></div>
<div id="win"><div style="display:flex;gap:10px"><img id="w1" alt=""><img id="w2" alt=""></div><h1 style="margin:0">Berhasil! 🎉</h1><p id="wm"></p><button class="btn" id="nx">Lanjut</button></div>

function tone(f,d=.15,t='sine',s=0,v=.2,dl=0){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),T=ac.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,T);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*s),T+d);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d)}catch(e){}}
const SFX={bonk:()=>{tone(180,.18,'square',.4,.25);tone(90,.2,'sine',.5,.4)},ouch:()=>tone(700,.28,'sawtooth',.4,.12),coin:()=>{tone(988,.08,'square',1,.12);tone(1319,.25,'square',1,.12,.08)},boing:()=>tone(200,.4,'sine',3,.3),pop:()=>tone(600,.1,'sine',2,.3),
sparkle:()=>[0,1,2,3,4].forEach(i=>tone(880*(1+i*.25),.15,'triangle',1,.14,i*.07)),sad:()=>[330,311,294,247].forEach((f,i)=>tone(f,.35,'sawtooth',.97,.1,i*.28)),
kiss:()=>{tone(1200,.08,'sine',1.5,.2);tone(1500,.1,'sine',.8,.2,.1)},yum:()=>{tone(300,.1,'triangle',1.5,.3);tone(450,.15,'triangle',1.5,.3,.1)},win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,'square',1,.1,i*.12))};
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'};
/* ===== SAPAAN WIB ===== */
const GR={pagi:['Selamat pagi, my Ratu ☀️','Semoga harimu seindah senyummu.'],siang:['Selamat siang, my Ratu 🌤️','Jangan lupa makan dan minum ya.'],sore:['Selamat sore, my Ratu 🌇','Terima kasih sudah kuat sepanjang hari ini.'],malam:['Selamat malam, my Ratu 🌙','Istirahat yang nyenyak, mimpi indah ya.']};
function per(){const h=+new Intl.DateTimeFormat('en-GB',{hour:'numeric',hour12:false,timeZone:'Asia/Jakarta'}).format(new Date())%24;return h<4?'malam':h<11?'pagi':h<15?'siang':h<18?'sore':'malam'}
function greet(){const g=GR[per()];$('#gr').textContent=g[0];$('#sg').textContent=g[0];$('#sm').textContent=g[1]}
greet();setInterval(greet,60000);
$('#simg').src=IMG.w5;$('#w1').src=IMG.w6;$('#w2').src=IMG.h2;$('#gimg').src=IMG.w4;
$('#go').onclick=()=>{$('#splash').style.display='none';SFX.sparkle()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.sec').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.t).classList.add('on');SFX.pop()});
function toast(t,ms=3200){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
function burst(x,y,l,n=14){for(let i=0;i<n;i++){const e=document.createElement('span');e.className='fx';e.textContent=l[i%l.length];e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);const dx=(Math.random()-.5)*320,dy=-80-Math.random()*280;e.animate([{transform:'translate(0,0) scale(.5)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(${1+Math.random()}) rotate(${dx}deg)`,opacity:0}],{duration:1000+Math.random()*800,easing:'ease-out'}).onfinish=()=>e.remove()}}
/* ===== GAME 1 ===== */
const AN={h1:{eL:[137,200],eR:[230,230],m:[147,333],cL:[113,287],cR:[273,293],f:[207,107]},h3:{eL:[129,200],eR:[263,212],m:[188,318],cL:[86,274],cR:[314,278],f:[188,78]}};
const LAB=['Masih ganteng 😎','Benjol 🥴','Mata panda 🐼','Babak belur 🤕','Rambut rontok, botak! 🥲','Pusing tujuh keliling 😵‍💫'];
const E=(p,rx,ry,c,o)=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="${rx}" ry="${ry}" fill="${c}" opacity="${o}"/>`;
function dmg(s,a){let o='';if(s>=1)o+=E(a.f,30,22,'#ff6b6b',.8)+E([a.f[0]-8,a.f[1]-7],8,5,'#fff',.6);
if(s>=2)o+=E(a.eL,34,24,'#6d28d9',.6);if(s>=3)o+=E(a.eR,34,24,'#6d28d9',.6)+E(a.cL,28,22,'#2563eb',.4)+`<g transform="rotate(-20 ${a.cR[0]} ${a.cR[1]})"><rect x="${a.cR[0]-26}" y="${a.cR[1]-9}" width="52" height="18" rx="4" fill="#f3c9a0"/><path d="M${a.cR[0]-6} ${a.cR[1]-9}v18M${a.cR[0]+6} ${a.cR[1]-9}v18" stroke="#c99" stroke-width="2"/></g>`;
if(s>=4)o+=E(a.cL,42,34,'#a855f7',.35)+E([a.cR[0]-25,a.cR[1]-6],38,32,'#a855f7',.3)+E([a.eL[0]-6,a.eL[1]+34],6,10,'#7dd3fc',.9)+E([a.eR[0]+6,a.eR[1]+34],6,10,'#7dd3fc',.9);
if(s>=5)o+=E(a.m,34,14,'#ef4444',.65)+`<rect x="${a.m[0]-4}" y="${a.m[1]-6}" width="9" height="11" fill="#111" opacity=".85"/><g transform="rotate(12 ${a.f[0]} ${a.f[1]-20})"><rect x="${a.f[0]-48}" y="${a.f[1]-34}" width="96" height="26" rx="5" fill="#fff"/><circle cx="${a.f[0]+10}" cy="${a.f[1]-21}" r="5" fill="#e11"/></g>`;return o}
let S={m:0,h:0,own:{}};try{Object.assign(S,JSON.parse(localStorage.getItem('ratu')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ratu',JSON.stringify(S))}catch(e){}};
let happy=false;
function draw(){const st=Math.min(5,Math.floor(S.h/3)),k=st>=4?'h3':'h1';$('#money').textContent=rp(S.m);
if(happy){$('#fimg').src=IMG.h2;$('#dmg').innerHTML='';$('#stage').textContent='Sudah diobati, ganteng lagi 😍';$('#stars').textContent='✨💖✨';return}
$('#fimg').src=IMG[k];$('#dmg').innerHTML=dmg(st,AN[k]);$('#stage').textContent=LAB[st];$('#stars').textContent=st>=4?'⭐💫⭐':''}
$('#face').addEventListener('pointerdown',e=>{if(happy)return;S.m+=100000;S.h++;const f=$('#face');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');SFX.bonk();setTimeout(SFX.ouch,60);
burst(e.clientX,e.clientY,['🔨','💥','⭐','💸'],6);const t=document.createElement('span');t.className='fx';t.style.cssText=`left:${e.clientX-40}px;top:${e.clientY-30}px;font-weight:800;color:#ffd166;font-size:22px`;t.textContent='+Rp100.000';document.body.appendChild(t);t.animate([{transform:'none',opacity:1},{transform:'translateY(-70px)',opacity:0}],{duration:900}).onfinish=()=>t.remove();
if(S.h%5==0)toast(rnd(['Aduh my Ratu! 😭','Ampun, Ratu! 🙏','Kepalaku berputar... 🌀','Uangnya masuk, mukaku keluar 🥲','Palunya kok semangat banget 😅']),1500);
if(S.h==12)toast('Rambutnya rontok jadi botak! 🤣');draw();save()});
const SH={Makanan:[['Crepes','🥞',150],['Martabak Manis','🧇',300],['Milk Bun Durian','🍞',200],['Dimsum','🥟',250],['Es Gabin','🍧',100],['Cimol','🍡',50],['Cilok','🍢',50],['Seblak','🌶️',150],['Salad','🥗',120],['Sushi','🍣',400],['Ramen','🍜',350]],
Shopping:[['Hijab','🧕',300],['Tas','👜',800],['Sepatu','👟',700],['Pakaian','👗',500]],
Jalan:[['Waduk Darma','🌊',200],['Pemandian Cibulan','🐟',250],['Gunung Ciremai','⛰️',500],['Telaga Biru Cicerem','💙',300],['Palutungan','🌲',350],['Linggarjati','🏛️',150],['Sangkanurip','♨️',250],['Balong Dalem','🐠',150]],
Investasi:[['Emas','🥇',2000,50],['Saham','📈',3000,80],['Tanah','🏞️',5000,100],['Kontrakan','🏠',8000,200]],
Obati:[['Obati si ganteng','💊',200]]};
const MSG={Makanan:['Nyam nyam! Ratu kenyang dan senang 😋','Enak banget, sampai lupa diet 🤭'],Shopping:['Ratu tampil makin cantik ✨','Dompet menangis, hati berbunga 🌸'],Jalan:['Perjalanan seru bareng Ratu 🚗💨','Foto-fotonya pasti cantik 📸'],Investasi:['Masa depan Ratu makin cerah 💰','Pintar! Pasif income jalan terus 😎']};
let cat='Makanan';
function shop(){$('#tabs').innerHTML=Object.keys(SH).map(k=>`<button class="${k==cat?'on':''}" data-k="${k}">${k}</button>`).join('');
$('#shop').innerHTML=SH[cat].map((x,i)=>`<button class="it ${S.m<x[2]*1000?'no':''}" data-i="${i}"><big>${x[1]}</big>${x[0]}${S.own[x[0]]?' ×'+S.own[x[0]]:''}<small>${rp(x[2]*1000)}${x[3]?' · +'+rp(x[3]*1000)+'/5dtk':''}</small></button>`).join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cat=b.dataset.k;SFX.pop();shop()});
document.querySelectorAll('#shop button').forEach(b=>b.onclick=e=>buy(SH[cat][b.dataset.i],e))}
function buy(x,e){const p=x[2]*1000;if(S.m<p){SFX.sad();toast('Uangnya belum cukup, pukul lagi dulu 😝',1800);return}
S.m-=p;if(cat=='Obati'){S.h=0;happy=true;SFX.sparkle();SFX.win();burst(innerWidth/2,innerHeight/2,['✨','💖','🌟'],24);toast('Terima kasih my Ratu, aku akan mengirimkan sesuatu padamu hari ini 💌',6000);setTimeout(()=>{happy=false;draw()},6500)}
else{S.own[x[0]]=(S.own[x[0]]||0)+1;(cat=='Investasi'?SFX.coin:SFX.yum)();burst(e.clientX,e.clientY,[x[1],'💖'],8);toast(x[1]+' '+x[0]+' berhasil! '+rnd(MSG[cat]))}
draw();shop();save()}
setInterval(()=>{let g=0;SH.Investasi.forEach(x=>g+=(S.own[x[0]]||0)*x[3]*1000);if(g){S.m+=g;draw();shop();save()}},5000);
draw();shop();
/* ===== GAME 2 ===== */
const DOA=['Semoga Allah selalu menjaga hatimu tetap tenang.','Semoga setiap langkahmu hari ini dimudahkan.','Semoga rezekimu lancar dan penuh berkah.','Semoga kamu selalu sehat, Ratu.','Semoga senyummu tetap jadi alasan orang bahagia.','Semoga lelahmu hari ini jadi pahala.','Semoga cita-citamu satu per satu terwujud.','Semoga Allah lindungi kamu dan keluargamu.','Semoga hatimu dikelilingi orang-orang baik.','Semoga hari ini penuh kabar menyenangkan.','Semoga kamu selalu merasa cukup dan bersyukur.','Semoga ilmu dan akhlakmu terus bertumbuh.','Semoga rindu yang baik selalu berujung temu.','Semoga mimpi-mimpimu dipeluk kenyataan.','Semoga Allah ganti sedihmu dengan tawa.','Semoga kamu selalu dalam lindungan-Nya.','Semoga tiap doamu dijawab dengan yang terbaik.','Semoga jalan kita dipermudah menuju kebaikan.','Semoga kamu tidur nyenyak dan bangun dengan semangat.','Semoga kamu dikuatkan di hari yang berat.'];
let bag=[];$('#girl').onclick=e=>{if(!bag.length)bag=[...DOA].sort(()=>Math.random()-.5);$('#doa').textContent='🤲 '+bag.pop();
const g=$('#gimg');g.src=IMG.w6;clearTimeout(g.t);g.t=setTimeout(()=>g.src=IMG.w4,1700);
['hand','blush'].forEach(i=>{const h=$('#'+i);h.classList.remove('on');void h.offsetWidth;h.classList.add('on')});
SFX.kiss();setTimeout(SFX.sparkle,120);burst(e.clientX,e.clientY,['💖','🌸','🌷','💕','🌹','🌺','✨'],18)};
/* ===== GAME 3 ===== */
const CO={r:'#ff4d6d',p:'#ffa8d0',y:'#ffd166',g:'#4ade80',b:'#60a5fa'};
const ART=[{n:'Hati',a:['.rr..rr.','rprrrrrr','rprrrrrr','rrrrrrrr','.rrrrrr.','..rrrr..','...rr...','........']},
{n:'Bunga',a:['..pppp..','.ppyypp.','.ppyypp.','..pppp..','...gg...','.g.gg.g.','..gggg..','...gg...']},
{n:'Mahkota Ratu',a:['y..y..y.','yy.yy.yy','yyyyyyyy','yyryyryy','yyyyyyyy','yyyyyyyy','bbbbbbbb','........']}];
let L=0,G;
function start(){const cells=[];ART[L].a.forEach((r,y)=>[...r].forEach((c,x)=>c!='.'&&cells.push({i:y*8+x,c,on:false})));
const ch=[];[...new Set(cells.map(c=>c.c))].forEach(c=>{const n=cells.filter(x=>x.c==c).length;for(let i=0;i<n;i+=3)ch.push({c,n:Math.min(3,n-i),got:0})});ch.sort(()=>Math.random()-.5);
const q=[];ch.forEach(k=>{for(let j=0;j<k.n;j++)q.push(k.c)});for(let i=0;i<q.length;i++){const j=i+Math.floor(Math.random()*5);if(j<q.length)[q[i],q[j]]=[q[j],q[i]]}
G={cells,dem:ch.slice(),bk:[],q:q.map((c,i)=>({c,w:i%2})),pk:[],left:cells.length,over:false};for(let i=0;i<4;i++)G.bk.push(G.dem.shift()||null);draw3()}
const av=a=>`style="--c:${CO[a.c]};background-image:url(${a.w?IMG.w6:IMG.h1});background-position:${a.w?'55% 44%':'46% 52%'}"`;
function draw3(){$('#lvl').textContent='Level '+(L+1)+': '+ART[L].n;
const m={};G.cells.forEach(c=>m[c.i]=c);$('#board').innerHTML=Array.from({length:64},(_,i)=>`<i ${m[i]&&m[i].on?`class="on" style="background:${CO[m[i].c]}"`:''}></i>`).join('');
$('#bks').innerHTML=G.bk.map(b=>b?`<div class="bk" style="--c:${CO[b.c]}"><em></em>${b.got}/${b.n}</div>`:`<div class="bk" style="opacity:.3"></div>`).join('');
$('#que').innerHTML=G.q.slice(0,5).map((a,i)=>`<button class="ant" data-q="${i}" ${av(a)}><i></i></button>`).join('');
$('#park').innerHTML=Array.from({length:5},(_,i)=>G.pk[i]?`<button class="ant" data-p="${i}" ${av(G.pk[i])}><i></i></button>`:'<div class="slot"></div>').join('');
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>tap(+b.dataset.q,false));document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>tap(+b.dataset.p,true))}
function tap(i,fp){if(G.over)return;const src=fp?G.pk:G.q,a=src[i],k=G.bk.findIndex(b=>b&&b.c==a.c);
if(k>=0){src.splice(i,1);const b=G.bk[k];b.got++;const c=rnd(G.cells.filter(x=>x.c==a.c&&!x.on));c.on=true;G.left--;SFX.pop();
if(b.got==b.n){SFX.coin();burst(innerWidth/2,innerHeight/2,['💖','✨'],8);G.bk[k]=G.dem.shift()||null}}
else if(!fp&&G.pk.length<5){src.splice(i,1);G.pk.push(a);SFX.boing()}else{SFX.sad();return}
draw3();if(!G.left){G.over=true;setTimeout(()=>{SFX.win();$('#wm').textContent='Gambar "'+ART[L].n+'" terungkap. Kerja sama kamu dan dia memang paling juara 💞';$('#nx').textContent=L<2?'Level berikutnya ➜':'Main dari awal 🔁';$('#win').style.display='flex'},500);return}
if(G.pk.length==5&&![...G.pk,...G.q.slice(0,5)].some(x=>G.bk.some(b=>b&&b.c==x.c))){G.over=true;SFX.sad();toast('Parkir penuh, semut bingung! Coba ulangi 🐜',2500)}}
$('#nx').onclick=()=>{$('#win').style.display='none';L=(L+1)%3;start()};$('#rst').onclick=()=>{SFX.pop();start()};start();
</script></body></html>
